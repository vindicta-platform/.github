name: Node.js CI Template

on:
  workflow_call:

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for pre-commit config
        id: check-config
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "::notice::No .pre-commit-config.yaml found, skipping pre-commit checks"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check-config.outputs.has_config == 'true'
        with:
          python-version: '3.11'

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        if: steps.check-config.outputs.has_config == 'true'
        with:
          extra_args: --all-files --show-diff-on-failure

  test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-commit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check
        run: npm run typecheck --if-present
        continue-on-error: true

      - name: Run unit tests first (fail-fast)
        run: npm run test:unit --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: hashFiles('playwright.config.*') != ''

      - name: Run e2e tests
        run: npm run test:e2e --if-present
        if: hashFiles('playwright.config.*') != ''

      - name: Run tests (fallback)
        run: npm test
        if: hashFiles('playwright.config.*') == ''

      - name: Upload test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.0
        if: failure()
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/

  convert-to-draft:
    name: Convert to Draft on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-commit, test]
    if: failure() && github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Convert PR to Draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const mutation = `mutation($id: ID!) {
              convertPullRequestToDraft(input: {pullRequestId: $id}) {
                pullRequest { isDraft }
              }
            }`;
            try {
              await github.graphql(mutation, {
                id: context.payload.pull_request.node_id
              });
              core.notice('PR converted to draft due to CI failure');
            } catch (error) {
              core.warning(`Could not convert to draft: ${error.message}`);
            }
