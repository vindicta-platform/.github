name: Python CI Template

on:
  workflow_call:

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for pre-commit config
        id: check-config
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "::notice::No .pre-commit-config.yaml found, skipping pre-commit checks"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check-config.outputs.has_config == 'true'
        with:
          python-version: '3.12'

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        if: steps.check-config.outputs.has_config == 'true'
        with:
          extra_args: --all-files --show-diff-on-failure

  test:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        # Every package that uses this template requires Python 3.12 or later.
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Python source files
        id: check-python
        run: |
          if [ -d "src" ] || find . -name "*.py" -not -path "./.git/*" | head -1 | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "::notice::No Python source files found, skipping tests"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check-python.outputs.has_python == 'true'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.check-python.outputs.has_python == 'true'

      - name: Cache uv dependencies
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.check-python.outputs.has_python == 'true'
        run: |
          # Fail here if dependencies cannot be installed; do not let a later step fail in its place.
          uv sync --all-extras

      - name: Lint with ruff
        if: steps.check-python.outputs.has_python == 'true'
        run: |
          uv run ruff check src/ --output-format=github
          uv run ruff format --check src/

      - name: Type check with mypy
        if: steps.check-python.outputs.has_python == 'true'
        run: uv run mypy src/ --ignore-missing-imports

      - name: Check for tests directory
        if: steps.check-python.outputs.has_python == 'true'
        id: check-tests
        run: |
          if [ -d "tests" ] && find tests -name "*.py" | head -1 | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::No tests directory found, skipping test execution"
          fi

      - name: Run tests with coverage
        if: steps.check-python.outputs.has_python == 'true' && steps.check-tests.outputs.has_tests == 'true'
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-fail-under=90

      - name: Check for BDD features
        if: steps.check-python.outputs.has_python == 'true'
        id: check-bdd
        run: |
          if [ -d "features" ] && find features -name "*.feature" | head -1 | grep -q .; then
            echo "has_bdd=true" >> $GITHUB_OUTPUT
          else
            echo "has_bdd=false" >> $GITHUB_OUTPUT
            echo "::notice::No BDD features found, skipping behave"
          fi

      - name: Run BDD tests with behave
        if: steps.check-python.outputs.has_python == 'true' && steps.check-bdd.outputs.has_bdd == 'true'
        run: uv run behave

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.0
        if: matrix.python-version == '3.12' && steps.check-tests.outputs.has_tests == 'true'
        with:
          name: coverage-report
          path: coverage.xml

  convert-to-draft:
    name: Convert to Draft on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-commit, test]
    if: failure() && github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Convert PR to Draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const mutation = `mutation($id: ID!) {
              convertPullRequestToDraft(input: {pullRequestId: $id}) {
                pullRequest { isDraft }
              }
            }`;
            try {
              await github.graphql(mutation, {
                id: context.payload.pull_request.node_id
              });
              core.notice('PR converted to draft due to CI failure');
            } catch (error) {
              core.warning(`Could not convert to draft: ${error.message}`);
            }
