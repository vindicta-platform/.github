name: Dependency Update

on:
  workflow_call:

concurrency:
  group: dep-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for pyproject.toml
        id: check
        run: |
          if [ -f 'pyproject.toml' ]; then
            echo 'has_pyproject=true' >> $GITHUB_OUTPUT
          else
            echo 'has_pyproject=false' >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.check.outputs.has_pyproject == 'true'
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: steps.check.outputs.has_pyproject == 'true'

      - name: Update lock file
        if: steps.check.outputs.has_pyproject == 'true'
        run: |
          uv lock --upgrade 2>&1 | tee update_log.txt

      - name: Check for changes
        if: steps.check.outputs.has_pyproject == 'true'
        id: diff
        run: |
          if git diff --quiet uv.lock 2>/dev/null; then
            echo 'changed=false' >> $GITHUB_OUTPUT
            echo '::notice::All dependencies are up to date'
          else
            echo 'changed=true' >> $GITHUB_OUTPUT
            UPDATED=$(git diff uv.lock | grep '^+' | grep -c 'version' || echo '0')
            echo "count=${UPDATED}" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv sync --all-extras
          uv run pytest tests/ -x --tb=short 2>&1 | tail -20 || true
        continue-on-error: true

      - name: Generate PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo '## 📦 Dependency Update' > pr_body.md
          echo '' >> pr_body.md
          echo "Auto-generated by the weekly dependency update workflow." >> pr_body.md
          echo '' >> pr_body.md
          echo "~${{ steps.diff.outputs.count }} package version(s) updated in \`uv.lock\`." >> pr_body.md
          echo '' >> pr_body.md
          echo '<details><summary>Update log</summary>' >> pr_body.md
          echo '' >> pr_body.md
          echo '```' >> pr_body.md
          tail -50 update_log.txt >> pr_body.md
          echo '```' >> pr_body.md
          echo '</details>' >> pr_body.md

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: 'chore(deps): update dependencies'
          body-path: pr_body.md
          branch: auto/dependency-update
          labels: |
            chore
            automated
          delete-branch: true
