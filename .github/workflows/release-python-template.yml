name: Python Release Template

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check for towncrier
        id: check-towncrier
        run: |
          if uv run towncrier --version 2>/dev/null; then
            echo "has_towncrier=true" >> $GITHUB_OUTPUT
          else
            echo "has_towncrier=false" >> $GITHUB_OUTPUT
            echo "::notice::Towncrier not found, skipping changelog generation"
          fi

      - name: Build Changelog via Towncrier
        if: steps.check-towncrier.outputs.has_towncrier == 'true'
        run: uv run towncrier build --yes --version ${{ github.ref_name }}

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
