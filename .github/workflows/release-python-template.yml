name: Python Release Template

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check for towncrier
        id: check-towncrier
        run: |
          if uv run towncrier --version 2>/dev/null; then
            echo "has_towncrier=true" >> $GITHUB_OUTPUT
          else
            echo "has_towncrier=false" >> $GITHUB_OUTPUT
            echo "::notice::Towncrier not found, skipping changelog generation"
          fi

      - name: Build Changelog via Towncrier
        if: steps.check-towncrier.outputs.has_towncrier == 'true'
        run: uv run towncrier build --yes --version ${{ github.ref_name }}

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
